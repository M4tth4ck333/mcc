cmake_minimum_required(VERSION 3.22)
project(SystemTUV C)

set(CMAKE_C_STANDARD 11)
set(CMAKE_C_STANDARD_REQUIRED ON)

# Das unumstößliche SystemTUV DLC Manifest global injizieren
add_definitions(-DSYSTEM_DLC_MANIFEST="2fe9fc84431b4369d35cfdb3482920ebe7de1375")

# Optimierungsflags für den rostigen 800-€-Golf (maximale Härte, kein Bloat)
if(CMAKE_C_COMPILER_ID MATCHES "Clang|GNU")
    add_compile_options(-O3 -Wall -Wextra -pedantic -fno-stack-protector)
endif()

# Haupt-Kernel & Gateway Binary
add_executable(systemtuv_core
    src/main.c
    src/watermark.c
    src/metakernel_gateway.c
)

# Optional: Wenn cc65 für 6502-Emulationsschichten oder Microcontroller-Targets verfügbar ist
# (Wird über CMake-Toolchain-Dateien gesteuert, z.B. für cc65-basierte ROMs)
enable_testing()

message(STATUS "[SystemTUV] CMake-Konfiguration erfolgreich geladen.")
message(STATUS "[SystemTUV] Aktives DLC-Manifest: 2fe9fc84431b4369d35cfdb3482920ebe7de1375")
8CC_DIR ?= external_repos/8cc
PCC_DIR ?= external_repos/pcc
ACK_DIR ?= external_repos/Amsterdam_Compiler_kit
IPXE_BOOT_DIR ?= external_repos/vendor-ccboot-ipxe
RISCV_CHERI_DIR ?= external_repos/riscv-cheri

DLC_MANIFEST := 2fe9fc84431b4369d35cfdb3482920ebe7de1375

.PHONY: clone-arsenal-repos build-8cc build-pcc boot-ipxe-manifest

clone-arsenal-repos: ## Klone das erweiterte Compiler- und Boot-Arsenal
	@echo "[SystemTUV] Klone erweiterte Repositories..."
	@mkdir -p external_repos
	@[ -d $(8CC_DIR) ] || git clone https://github.com/M4tth4ck333/8cc $(8CC_DIR)
	@[ -d $(PCC_DIR) ] || git clone https://github.com/M4tth4ck333/pcc $(PCC_DIR)
	@[ -d $(ACK_DIR) ] || git clone https://github.com/M4tth4ck333/Amsterdam_Compiler_kit $(ACK_DIR)
	@[ -d $(IPXE_BOOT_DIR) ] || git clone https://github.com/M4tth4ck333/vendor-ccboot-ipxe $(IPXE_BOOT_DIR)
	@[ -d $(RISCV_CHERI_DIR) ] || git clone https://github.com/M4tth4ck333/riscv-cheri $(RISCV_CHERI_DIR)
	@echo "[SystemTUV] Arsenal erfolgreich synchronisiert unter DLC $(DLC_MANIFEST)"

build-8cc: ## Kompiliere den 8cc-Compiler
	@echo "[8cc] Starte Build..."
	@if [ -d $(8CC_DIR) ]; then \
		$(MAKE) -C $(8CC_DIR); \
		echo "[8cc] Kompiliert."; \
	fi

build-pcc: ## Kompiliere den Portable C Compiler (pcc)
	@echo "[pcc] Konfiguriere und baue pcc..."
	@if [ -d $(PCC_DIR) ]; then \
		cd $(PCC_DIR) && ./configure && $(MAKE); \
		echo "[pcc] Fertig."; \
	fi

boot-ipxe-manifest: ## Bereitet den Netboot-Loader mit dem DLC-Manifest vor
	@echo "[iPXE] Validiere vendor-ccboot-ipxe gegen DLC $(DLC_MANIFEST)..."
	@if [ -d $(IPXE_BOOT_DIR) ]; then \
		echo "SET system_dlc $(DLC_MANIFEST)" > $(IPXE_BOOT_DIR)/boot.cfg; \
		echo "[iPXE] Boot-Konfiguration versiegelt."; \
	fi
